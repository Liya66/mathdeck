server {
    listen 80;
    server_name _;
    # Without this nginx rebuilds redirects as http://localhost/... and loses the port.
    absolute_redirect off;

    # Only public/ is reachable. Nothing under src/, config/ or vendor/ is served.
    root /app/public;
    # index.html first so /app/ serves the browser client; index.php is the API.
    index index.html index.php;

    # The pages are all local: no CDN, no inline scripts, no framing. Styles need
    # 'unsafe-inline' only because the dashboard declares its chart tokens in a
    # <style> block; scripts are external modules and need no exception at all.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = / {
        return 302 /app/;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Resolve the upstream per request through Docker's embedded DNS. With a
        # literal `fastcgi_pass app:9000;` nginx resolves once at startup and caches
        # the address forever — so recreating the app container turns every request
        # into a 502 until nginx is restarted too.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Appends the peer we actually saw. The app reads the LAST entry, so a
        # client-supplied X-Forwarded-For cannot pick its own throttle bucket.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        internal;
    }

    # A request for any other .php file is a probe, not a route.
    location ~ \.php$ {
        return 404;
    }
}
